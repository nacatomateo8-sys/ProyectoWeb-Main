<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <h2>Mis Compras</h2>
    
    <div style="margin-bottom: 20px;">
        <a th:href="@{/carrito}">← Volver al Carrito</a>
    </div>

    <table border="1">
        <thead>
            <tr><th>Fecha</th><th>Detalle de Productos</th><th>Total</th></tr>
        </thead>
        <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy')}"></td>
                <td>
                    <ul>
                        <li th:each="d : ${pedido.detalles}" 
                            th:text="${d.cantidad} + 'x ' + ${d.productoNombre} + ' ($' + ${d.precioUnitario} + ')'">
                        </li>
                    </ul>
                </td>
                <td th:text="'$' + ${pedido.total}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="3" style="text-align: center; padding: 20px;">
                    Aún no has realizado ninguna compra.
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
