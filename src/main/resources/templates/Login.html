<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; text-align: center;">
        <h2>Bienvenido a Puntada Creativa</h2>
        <form th:action="@{/login/async}" method="post">
            <input type="text" name="username" placeholder="Usuario o Email" required><br><br>
            <input type="password" name="password" placeholder="Contraseña" required><br><br>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
